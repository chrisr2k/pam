{% extends 'pam/base.html' %}

{% block title %}Help - PAM{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-3">
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-question-circle"></i> User Guide
            </div>
            <ul class="nav flex-column">
                {% for key, label in sections %}
                <li class="nav-item">
                    <a class="nav-link {% if active_section == key %}active fw-bold{% endif %}"
                       href="{% url 'accounts:help_section' key %}">{{ label }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
        <p class="text-muted small">
            <i class="bi bi-info-circle"></i>
            Questions not covered here? Contact your PAM administrator.
        </p>
    </div>
    <div class="col-lg-9">
        <div class="card">
            <div class="card-body">
                {% block help_content %}{% endblock %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
