version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pam
      POSTGRES_USER: pam
      POSTGRES_PASSWORD: pam_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      ENV_MASTER_PASSWORD: ${ENV_MASTER_PASSWORD:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-random-secret-key}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,${PAM_DOMAIN:-localhost}
      DATABASE_URL: postgres://pam:pam_password@db:5432/pam
      REDIS_URL: redis://redis:6379/0
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_PIM_TENANT_ID: ${ENTRA_PIM_TENANT_ID:-}
      ENTRA_PIM_CLIENT_ID: ${ENTRA_PIM_CLIENT_ID:-}
      ENTRA_PIM_CLIENT_SECRET: ${ENTRA_PIM_CLIENT_SECRET:-}
      ENTRA_PIM_CERTIFICATE_PATH: ${ENTRA_PIM_CERTIFICATE_PATH:-}
      ENTRA_PIM_CERTIFICATE_PASSWORD: ${ENTRA_PIM_CERTIFICATE_PASSWORD:-}
      ENTRA_PIM_CERTIFICATE_B64: ${ENTRA_PIM_CERTIFICATE_B64:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SSO_INSTANCE_ARN: ${AWS_SSO_INSTANCE_ARN:-}
      OCI_VAULT_OCID: ${OCI_VAULT_OCID:-}
      OCI_SECRET_OCID_PAM_DJANGO_SECRET_KEY: ${OCI_SECRET_OCID_PAM_DJANGO_SECRET_KEY:-}
      OCI_SECRET_OCID_PAM_ENTRA_CLIENT_SECRET: ${OCI_SECRET_OCID_PAM_ENTRA_CLIENT_SECRET:-}
      OCI_SECRET_OCID_PAM_AWS_ACCESS_KEY_ID: ${OCI_SECRET_OCID_PAM_AWS_ACCESS_KEY_ID:-}
      OCI_SECRET_OCID_PAM_AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_OCID_PAM_AWS_SECRET_ACCESS_KEY:-}
      OCI_SECRET_OCID_PAM_AWS_SSO_INSTANCE_ARN: ${OCI_SECRET_OCID_PAM_AWS_SSO_INSTANCE_ARN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo &&
             gunicorn pam.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"

  celery_worker:
    build: .
    environment:
      ENV_MASTER_PASSWORD: ${ENV_MASTER_PASSWORD:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-random-secret-key}
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://pam:pam_password@db:5432/pam
      REDIS_URL: redis://redis:6379/0
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_PIM_TENANT_ID: ${ENTRA_PIM_TENANT_ID:-}
      ENTRA_PIM_CLIENT_ID: ${ENTRA_PIM_CLIENT_ID:-}
      ENTRA_PIM_CLIENT_SECRET: ${ENTRA_PIM_CLIENT_SECRET:-}
      ENTRA_PIM_CERTIFICATE_PATH: ${ENTRA_PIM_CERTIFICATE_PATH:-}
      ENTRA_PIM_CERTIFICATE_PASSWORD: ${ENTRA_PIM_CERTIFICATE_PASSWORD:-}
      ENTRA_PIM_CERTIFICATE_B64: ${ENTRA_PIM_CERTIFICATE_B64:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SSO_INSTANCE_ARN: ${AWS_SSO_INSTANCE_ARN:-}
      OCI_VAULT_OCID: ${OCI_VAULT_OCID:-}
      OCI_SECRET_OCID_PAM_DJANGO_SECRET_KEY: ${OCI_SECRET_OCID_PAM_DJANGO_SECRET_KEY:-}
      OCI_SECRET_OCID_PAM_ENTRA_CLIENT_SECRET: ${OCI_SECRET_OCID_PAM_ENTRA_CLIENT_SECRET:-}
      OCI_SECRET_OCID_PAM_AWS_ACCESS_KEY_ID: ${OCI_SECRET_OCID_PAM_AWS_ACCESS_KEY_ID:-}
      OCI_SECRET_OCID_PAM_AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_OCID_PAM_AWS_SECRET_ACCESS_KEY:-}
      OCI_SECRET_OCID_PAM_AWS_SSO_INSTANCE_ARN: ${OCI_SECRET_OCID_PAM_AWS_SSO_INSTANCE_ARN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A pam worker -l info

  celery_beat:
    build: .
    environment:
      ENV_MASTER_PASSWORD: ${ENV_MASTER_PASSWORD:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-random-secret-key}
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://pam:pam_password@db:5432/pam
      REDIS_URL: redis://redis:6379/0
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_PIM_TENANT_ID: ${ENTRA_PIM_TENANT_ID:-}
      ENTRA_PIM_CLIENT_ID: ${ENTRA_PIM_CLIENT_ID:-}
      ENTRA_PIM_CLIENT_SECRET: ${ENTRA_PIM_CLIENT_SECRET:-}
      ENTRA_PIM_CERTIFICATE_PATH: ${ENTRA_PIM_CERTIFICATE_PATH:-}
      ENTRA_PIM_CERTIFICATE_PASSWORD: ${ENTRA_PIM_CERTIFICATE_PASSWORD:-}
      ENTRA_PIM_CERTIFICATE_B64: ${ENTRA_PIM_CERTIFICATE_B64:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SSO_INSTANCE_ARN: ${AWS_SSO_INSTANCE_ARN:-}
      OCI_VAULT_OCID: ${OCI_VAULT_OCID:-}
      OCI_SECRET_OCID_PAM_DJANGO_SECRET_KEY: ${OCI_SECRET_OCID_PAM_DJANGO_SECRET_KEY:-}
      OCI_SECRET_OCID_PAM_ENTRA_CLIENT_SECRET: ${OCI_SECRET_OCID_PAM_ENTRA_CLIENT_SECRET:-}
      OCI_SECRET_OCID_PAM_AWS_ACCESS_KEY_ID: ${OCI_SECRET_OCID_PAM_AWS_ACCESS_KEY_ID:-}
      OCI_SECRET_OCID_PAM_AWS_SECRET_ACCESS_KEY: ${OCI_SECRET_OCID_PAM_AWS_SECRET_ACCESS_KEY:-}
      OCI_SECRET_OCID_PAM_AWS_SSO_INSTANCE_ARN: ${OCI_SECRET_OCID_PAM_AWS_SSO_INSTANCE_ARN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A pam beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PAM_DOMAIN: ${PAM_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
